name: Nouvelle carte
description: Publier le plan SVG d'une sortie Ariane.
title: "Carte : "
labels: ["nouvelle-carte"]
body:
  - type: markdown
    attributes:
      value: |
        Mets le nom de la carte dans le titre du ticket, après « Carte : ».
        Dans Ariane : Réglages, Mes sorties, ta sortie, Préparer les exports, puis « Partager la carte SVG ».
        Le SVG peut être déposé tel quel (il sera publié comme plan), ou préparé sur la page « Ajouter une carte » du site pour ajouter un auteur, une description ou des points GPS.
        À l'envoi, le fichier est vérifié puis publié automatiquement en une à deux minutes. La carte est publique.
  - type: textarea
    id: fichier
    attributes:
      label: Plan de la carte
      description: Glisse ici le fichier .svg (sur téléphone, touche la zone puis l'icône de pièce jointe).
    validations:
      required: true
