name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  deploiement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Index des cartes
        run: node scripts/index.js
      - name: Fichiers du site
        run: |
          mkdir _site
          cp -r index.html carte.html ajouter.html css js cartes _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
