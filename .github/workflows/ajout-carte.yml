name: Ajout de carte

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ajout-carte
  cancel-in-progress: false

jobs:
  ajout:
    if: contains(github.event.issue.labels.*.name, 'nouvelle-carte')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      ok: ${{ steps.lecture.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lecture et validation du fichier
        id: lecture
        run: node scripts/ajouter-carte.js
      - name: Publication
        if: steps.lecture.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartes
          git commit -F "$RUNNER_TEMP/commit.txt"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Réponse dans le ticket
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          OK: ${{ steps.lecture.outputs.ok }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reponse.md"
          if [ "$OK" = "true" ]; then gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY"; fi

  site:
    needs: ajout
    if: needs.ajout.outputs.ok == 'true'
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
